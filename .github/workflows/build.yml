name: Build OpenCode

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Clone OpenCode
        run: git clone --depth 1 https://github.com/opencode-ai/opencode.git /tmp/opencode

      - name: Patch provider for OPENAI_BASE_URL
        working-directory: /tmp/opencode
        run: |
          sed -i '/case models.ProviderOpenAI:/{
            a\
            \t\tif baseURL := os.Getenv("OPENAI_BASE_URL"); baseURL != "" {\
            \t\t\tclientOptions.openaiOptions = append(clientOptions.openaiOptions,\
            \t\t\t\tWithOpenAIBaseURL(baseURL),\
            \t\t\t)\
            \t\t}
          }' internal/llm/provider/provider.go
          
          grep -A8 "case models.ProviderOpenAI:" internal/llm/provider/provider.go

      - name: Build
        working-directory: /tmp/opencode
        run: GOAMD64=v1 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/opencode-atom .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: opencode-atom
          path: /tmp/opencode-atom
          retention-days: 30